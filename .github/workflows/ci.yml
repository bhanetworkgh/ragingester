name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=dev

      - name: Validate E2E secret wiring
        env:
          RUN_RSS_E2E: ${{ secrets.RUN_RSS_E2E }}
          GENIE_RSS_API_KEY: ${{ secrets.GENIE_RSS_API_KEY }}
          BHARAG_RSS_WORKSPACE_ID: ${{ secrets.BHARAG_RSS_WORKSPACE_ID }}
          BHARAG_RSS_WORKSPACE_API_KEY: ${{ secrets.BHARAG_RSS_WORKSPACE_API_KEY }}
        run: |
          set -euo pipefail
          run_flag="$(echo "${RUN_RSS_E2E:-}" | tr '[:upper:]' '[:lower:]' | xargs)"
          if [ "$run_flag" = "1" ] || [ "$run_flag" = "true" ] || [ "$run_flag" = "yes" ] || [ "$run_flag" = "on" ]; then
            missing=0
            if [ -z "${GENIE_RSS_API_KEY:-}" ]; then
              echo "::error::RUN_RSS_E2E is enabled, but missing secret GENIE_RSS_API_KEY"
              missing=1
            fi
            if [ -z "${BHARAG_RSS_WORKSPACE_ID:-}" ]; then
              echo "::error::RUN_RSS_E2E is enabled, but missing secret BHARAG_RSS_WORKSPACE_ID"
              missing=1
            fi
            if [ -z "${BHARAG_RSS_WORKSPACE_API_KEY:-}" ]; then
              echo "::error::RUN_RSS_E2E is enabled, but missing secret BHARAG_RSS_WORKSPACE_API_KEY"
              missing=1
            fi
            if [ "$missing" -ne 0 ]; then
              echo "::error::E2E secret validation failed."
              exit 1
            fi
            echo "E2E secret validation passed."
          else
            echo "RUN_RSS_E2E is disabled; skipping E2E secret validation."
          fi

      - name: Test
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENIE_RSS_BASE_URL: ${{ secrets.GENIE_RSS_BASE_URL }}
          GENIE_RSS_API_KEY: ${{ secrets.GENIE_RSS_API_KEY }}
          BHARAG_BASE_URL: ${{ secrets.BHARAG_BASE_URL }}
          BHARAG_RSS_WORKSPACE_ID: ${{ secrets.BHARAG_RSS_WORKSPACE_ID }}
          BHARAG_RSS_WORKSPACE_API_KEY: ${{ secrets.BHARAG_RSS_WORKSPACE_API_KEY }}
          BHARAG_RSS_LEDGER_SCHEMA: ${{ secrets.BHARAG_RSS_LEDGER_SCHEMA }}
          BHARAG_YOUTUBE_WORKSPACE_ID: ${{ secrets.BHARAG_YOUTUBE_WORKSPACE_ID }}
          BHARAG_YOUTUBE_WORKSPACE_API_KEY: ${{ secrets.BHARAG_YOUTUBE_WORKSPACE_API_KEY }}
          BHARAG_YOUTUBE_LEDGER_SCHEMA: ${{ secrets.BHARAG_YOUTUBE_LEDGER_SCHEMA }}
          BHARAG_LINKEDIN_WORKSPACE_ID: ${{ secrets.BHARAG_LINKEDIN_WORKSPACE_ID }}
          BHARAG_LINKEDIN_WORKSPACE_API_KEY: ${{ secrets.BHARAG_LINKEDIN_WORKSPACE_API_KEY }}
          BHARAG_LINKEDIN_LEDGER_SCHEMA: ${{ secrets.BHARAG_LINKEDIN_LEDGER_SCHEMA }}
          BHARAG_SMARTCURSOR_WORKSPACE_ID: ${{ secrets.BHARAG_SMARTCURSOR_WORKSPACE_ID }}
          BHARAG_SMARTCURSOR_WORKSPACE_API_KEY: ${{ secrets.BHARAG_SMARTCURSOR_WORKSPACE_API_KEY }}
          BHARAG_SMARTCURSOR_LEDGER_SCHEMA: ${{ secrets.BHARAG_SMARTCURSOR_LEDGER_SCHEMA }}
          RUN_RSS_E2E: ${{ secrets.RUN_RSS_E2E }}
        run: npm run test -w @ragingester/api

      - name: Build Web
        run: npm run build -w @ragingester/web

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render Deploy
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/render-deploy-body -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")"
          cat /tmp/render-deploy-body || true
          echo
          # 409 means Render already has a deploy in flight (auto-deploy or a prior hook).
          if [ "$status" = "200" ] || [ "$status" = "201" ] || [ "$status" = "202" ] || [ "$status" = "409" ]; then
            echo "Render deploy hook accepted ($status)"
            exit 0
          fi
          echo "Render deploy hook failed ($status)"
          exit 1
